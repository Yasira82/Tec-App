name: CI

on:
  # Feature branches are covered by the pull_request event (the check that gates
  # merge). push runs ONLY on main — so a branch commit that has an open PR fires
  # exactly ONE pipeline, not two. Running on both used to start two identical
  # ~15-min runs per commit; worse, when the concurrency guard cancelled the
  # duplicate it left a red "cancelled" check that made a healthy PR look failed.
  push:
    branches: [main]
    paths:
      - 'tec-frontend/**'
      - 'package*.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tec-frontend/**'
      - 'package*.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded run when a NEWER commit is pushed to the same PR/branch —
# the standard idiom. Keyed on the ref (not the commit SHA), so it never makes
# the push and pull_request events of the SAME commit cancel each other.
#
# `main` is EXCLUDED from cancellation. This file previously read
# `cancel-in-progress: true`, which also cancelled runs on `main` — and a run
# there is the post-merge record (and the status a deploy gate reads), the one
# signal worth paying for. The fleet carried two spellings of this rule; this
# is now the single one, taken from `tec-knowledge-base` knowledge-ci.yml (P2).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pipeline:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Drift Detection — KB claims vs code
        working-directory: tec-frontend
        # Asserts that code still matches the constitutional claims it is supposed
        # to uphold. Each check maps to a specific C-doc; a violation = doc↔runtime
        # drift. Authority: C-12 §11 (CSRF), C-47/ADR-009 (payment contract),
        # C-96 (single health poller).
        run: |
          violations=0

          # ── ADR-009: unified payment contract ───────────────────────────
          if grep -rniE 'x-service-secret|SERVICE_SECRET' src; then
            echo "::error::ADR-009: use x-internal-key / INTERNAL_SECRET (not x-service-secret / SERVICE_SECRET)"
            violations=1
          fi
          if grep -rnE 'amount:[[:space:]]*z\.string' src | grep -qi payment; then
            echo "::error::ADR-009: payment amount must be a number — no z.string() for amount in payment routes"
            violations=1
          fi

          # ── C-12 §11 / P2: CSRF enforced ONLY in middleware ─────────────
          if grep -rnE 'csrfCookie !== csrfHeader|csrfCookie === csrfHeader|CSRF validation failed|CSRF token mismatch' src/app/api 2>/dev/null; then
            echo "::error::CSRF must be enforced ONLY in middleware (P2 single source of truth). Remove route-level CSRF checks — they 403 legit Pi-Browser payments."
            violations=1
          fi

          # ── C-96 / NEW-K: single health poller (no per-component polling) ─
          # Components/pages must consume usePlatformHealth(); only the context
          # may run a health poller (useBackendHealth / setInterval over health).
          if grep -rnE 'useBackendHealth' src/components src/app 2>/dev/null; then
            echo "::error::C-96: components/pages must use usePlatformHealth() — only PlatformHealthContext may call the useBackendHealth poller (single health runtime)."
            violations=1
          fi
          poller_files=$(grep -rlE 'setInterval' src --include=*.ts --include=*.tsx 2>/dev/null \
            | xargs grep -lE 'checkBackendHealth|checkGatewayHealth' 2>/dev/null \
            | grep -vE 'context/PlatformHealthContext|hooks/useBackendHealth' || true)
          if [ -n "$poller_files" ]; then
            echo "::error::C-96: health polling found outside PlatformHealthContext — single health runtime only. Offending file(s):"
            echo "$poller_files"
            violations=1
          fi

          [ "$violations" -eq 0 ] && echo "Drift Detection OK — code matches KB claims" || exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: tec-frontend/node_modules
          key: ${{ runner.os }}-hub-${{ hashFiles('tec-frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-hub-

      - name: Install
        run: npm install --legacy-peer-deps
        working-directory: tec-frontend

      - name: Security audit (advisory)
        run: npm audit --audit-level=high
        working-directory: tec-frontend
        continue-on-error: true

      - name: Lint
        run: npm run lint
        working-directory: tec-frontend
        continue-on-error: true

      - name: Clear TS cache
        run: rm -f tsconfig.tsbuildinfo
        working-directory: tec-frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: tec-frontend

      - name: Test
        run: npm test
        working-directory: tec-frontend

      - name: Build
        run: npm run build
        working-directory: tec-frontend
        env:
          NEXT_PUBLIC_PI_SANDBOX: 'true'
          NEXT_PUBLIC_PI_APP_ID:  ${{ secrets.NEXT_PUBLIC_PI_APP_ID || 'tec-app-923b947851f9dfe1' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: hub-build
          path: tec-frontend/.next/
          retention-days: 3
