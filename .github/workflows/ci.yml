name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'tec-frontend/**'
      - 'package*.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tec-frontend/**'
      - 'package*.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Payment contract policy (ADR-009)
        working-directory: tec-frontend
        run: |
          violations=0
          if grep -rniE 'x-service-secret|SERVICE_SECRET' src; then
            echo "::error::ADR-009: use x-internal-key / INTERNAL_SECRET (not x-service-secret / SERVICE_SECRET)"
            violations=1
          fi
          if grep -rnE 'amount:[[:space:]]*z\.string' src | grep -qi payment; then
            echo "::error::ADR-009: payment amount must be a number — no z.string() for amount in payment routes"
            violations=1
          fi
          [ "$violations" -eq 0 ] && echo "payment contract policy OK" || exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: tec-frontend/node_modules
          key: ${{ runner.os }}-hub-${{ hashFiles('tec-frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-hub-

      - name: Install
        run: npm install --legacy-peer-deps
        working-directory: tec-frontend

      - name: Lint
        run: npm run lint
        working-directory: tec-frontend
        continue-on-error: true

      - name: Clear TS cache
        run: rm -f tsconfig.tsbuildinfo
        working-directory: tec-frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: tec-frontend

      - name: Test
        run: npm test
        working-directory: tec-frontend

      - name: Build
        run: npm run build
        working-directory: tec-frontend
        env:
          NEXT_PUBLIC_PI_SANDBOX: 'true'
          NEXT_PUBLIC_PI_APP_ID:  ${{ secrets.NEXT_PUBLIC_PI_APP_ID || 'tec-app-923b947851f9dfe1' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: hub-build
          path: tec-frontend/.next/
          retention-days: 3
