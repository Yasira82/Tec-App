name: E2E Tests

on:
  # ✅ E2E على PR فقط — مش على كل push
  pull_request:
    branches: [main]
    paths:
      - 'tec-frontend/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

# One run per ref. Pushing again to a PR branch cancels the superseded run
# instead of racing it: the last commit is the only one anyone reads, and
# without this every intermediate push paid for a full pipeline — CI's five
# jobs, a CodeQL analysis, a Playwright install-build-and-run — that was
# obsolete before it finished.
#
# `main` is EXCLUDED from cancellation on purpose: a run there is the
# post-merge record (and the status a deploy gate reads). Cancelling those
# would trade money for the one signal worth keeping.
#
# This expression is copied verbatim from `tec-knowledge-base`
# knowledge-ci.yml — the fleet had TWO forms of this rule and the other one
# (tec-app, `cancel-in-progress: true`) cancels main runs as well. One rule,
# one spelling (P2).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ✅ Cache node_modules
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: tec-frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('tec-frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-frontend-

      - name: Install dependencies
        working-directory: tec-frontend
        run: npm install --legacy-peer-deps

      # ✅ Cache Playwright browsers
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('tec-frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright browsers
        working-directory: tec-frontend
        run: npx playwright install --with-deps chromium

      # ✅ استخدم الـ build artifact من الـ CI لو موجود
      - name: Build frontend
        working-directory: tec-frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_GATEWAY_URL: 'http://localhost:8080'
          NEXT_PUBLIC_REALTIME_URL:    'http://localhost:8080'
          E2E_MODE:                    'true'

      - name: Run E2E tests
        working-directory: tec-frontend
        run: npm run test:e2e
        env:
          CI:                          'true'
          E2E_MODE:                    'true'
          E2E_ALLOW_NETWORK:           'false'
          PLAYWRIGHT_BASE_URL:         'http://localhost:3000'
          NEXT_PUBLIC_API_GATEWAY_URL: 'http://localhost:8080'
          NEXT_PUBLIC_REALTIME_URL:    'http://localhost:8080'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tec-frontend/playwright-report/
          retention-days: 7

      # ✅ Upload test results
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: tec-frontend/test-results/
          retention-days: 7
